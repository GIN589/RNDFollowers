name: Build RNDFollowers

on:
  workflow_dispatch:
  push:
    branches: [main, master]

env:
  # CommonLibSSE-NG release to build against (alandtse/CommonLibSSE-NG). Reads Address Library formats 1, 2 and 5.
  COMMONLIB_TAG: v15.4.0

jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - name: Get CommonLibSSE-NG
        shell: bash
        run: |
          set -e
          rm -rf extern/CommonLibSSE-NG
          git clone --depth 1 --branch "$COMMONLIB_TAG" --recurse-submodules --shallow-submodules \
            https://github.com/alandtse/CommonLibSSE-NG.git extern/CommonLibSSE-NG
          git -C extern/CommonLibSSE-NG log -1 --oneline

      - name: Configure vcpkg
        shell: bash
        run: |
          set -e
          vbase=$(git -C "$VCPKG_INSTALLATION_ROOT" rev-parse HEAD)
          printf '{"default-registry":{"kind":"builtin","baseline":"%s"}}\n' "$vbase" > vcpkg-configuration.json
          cat vcpkg-configuration.json

      - name: Configure
        shell: pwsh
        run: |
          cmake -B build -S . -A x64 `
            -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake" `
            -DVCPKG_TARGET_TRIPLET=x64-windows-static-md `
            -DVCPKG_HOST_TRIPLET=x64-windows-static-md

      - name: Build
        shell: pwsh
        run: cmake --build build --config Release

      - name: Upload plugin
        uses: actions/upload-artifact@v4
        with:
          name: RNDFollowers
          path: |
            build/**/RNDFollowers.dll
            build/**/RNDFollowers.pdb
            Data/SKSE/Plugins/RNDFollowers.ini
