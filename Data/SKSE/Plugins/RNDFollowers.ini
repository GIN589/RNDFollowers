; RNDFollowers v2 configuration
; Rates, stage thresholds, food values and penalties all come from RND itself
; (RND globals + the RNDF_* abilities in RNDFollowers.esp), so they follow your RND/MCM settings.

[General]
; Include animal followers (e.g. Meeko)
IncludeAnimals=false
Notifications=true
; Show a message when a need reaches this stage (1-5)
NotifyFromStage=3
; Update interval in real milliseconds
TickMs=1000
; Pause follower needs when RND's own RND_State global is 0
OnlyWhenRNDActive=true
; RND slows the player when completely full (hunger stage 0). Off by default for followers.
ApplyFullStomachSlow=false
; Uninstall mode: set true, load a save with followers nearby so every RNDF_ ability is removed,
; save, then delete RNDFollowers.dll / RNDFollowers.esp
Uninstall=false

[Start]
; Starting values (RND points) for a follower the plugin sees for the first time
Hunger=20
Thirst=20
Fatigue=10

[Sleep]
; Followers within this distance of the player count as sleeping when the player sleeps
; (Sleep in Bed SKSE / Spooning of Skyrim). Followers lying in a bed are detected on their own.
FollowerSleepRadius=1500
; Fatigue points recovered per hour of sleep
RestPointsPerHour=40
SleepHungerMult=0.5
SleepThirstMult=0.5
CombatFatigueMult=1.5

[Disease]
; Chance per hit from an attacker whose race has one of these keywords (before disease resistance)
ChancePerHitPct=4
SourceRaceKeywords=ActorTypeAnimal,ActorTypeUndead
; Game hours between disease stages (RND uses 6)
HoursPerStage=6
; Diseases add fatigue per hour, like RND
DiseaseAddsFatigue=true

[Messages]
; Shown as "<follower name> <text>". {} is replaced by the disease name.
Hunger1=is peckish
Hunger2=is hungry
Hunger3=is very hungry
Hunger4=is starving
Hunger5=is famished
Thirst1=is a bit thirsty
Thirst2=is thirsty
Thirst3=is very thirsty
Thirst4=is parched
Fatigue1=is a bit tired
Fatigue2=is tired
Fatigue3=is very tired
Fatigue4=is exhausted
Infected=caught {}
Recovered=recovered from {}
